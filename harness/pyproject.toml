[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnicoach-harness"
version = "0.1.0"
description = "Open-OmniCoach active-perception trace-collection harness."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "decord>=0.6.0; sys_platform != 'darwin'",
  "openai>=2.53,<3",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "av>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
omnicoach-harness = "omnicoach_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnicoach_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "SIM", "BLE"]
ignore = [
  "BLE001", # provider/media boundaries intentionally normalize arbitrary client failures
]

[tool.ruff.lint.isort]
known-first-party = ["omnicoach_harness"]
